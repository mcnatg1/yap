[package]
name = "yap-desktop"
version = "0.1.0"
description = "Yap desktop client"
authors = ["Yap contributors"]
edition = "2021"
rust-version = "1.96"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yap_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
reqwest-websocket = { version = "=0.6.0", default-features = false }
futures-util = { version = "0.3.32", default-features = false, features = ["sink"] }
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
tauri-plugin-global-shortcut = "2"
cpal = "0.16"
# mp3 only for now; m4a needs a separate AAC patent decision.
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
# Canonical WAV writing. Zero transitive dependencies.
hound = "3.5"
sherpa-onnx = "1.13.4"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "api-24", "alternative-backend"] }
realfft = "=3.5.0"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Foundation", "Security_Authentication_Web_Core", "Security_Credentials", "Win32_System_WinRT", "Win32_System_Com"] }
windows-future = "0.2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
time = { version = "0.3.53", default-features = false, features = ["formatting", "parsing"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
dirs = "6"
sys-locale = "0.3.2"
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
